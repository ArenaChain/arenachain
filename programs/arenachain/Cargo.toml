[package]
name = "arenachain"
version = "0.1.0"
description = "ArenaChain: escrowed 1v1 CS2 matches with server-signed results"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "arenachain"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "=1.1.2"
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token", "token_2022"] }
solana-instructions-sysvar = "3"
solana-sdk-ids = "3"

[dev-dependencies]
litesvm = { version = "0.10.0", features = ["precompiles"] }
spl-token-interface = "2"
spl-associated-token-account-interface = "2"
solana-program-pack = "3"
solana-program-option = "3"
solana-account = "3"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
